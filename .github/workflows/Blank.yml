# Gerar APK + AAB Android V29

name: Gerar APK e AAB Android V29

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 16
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Preparar projeto Android V29
        run: |
          unzip -o Kazin_Tecnico_2026_V29_APP.zip
          find . -name gradlew -type f

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Dar permissão ao Gradle
        run: |
          find . -name gradlew -type f -exec chmod +x {} \;

      - name: Gerar APK + AAB
        working-directory: android_project
        run: |
          ./gradlew assembleDebug bundleRelease

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V29-APK
          path: android_project/**/build/outputs/apk/**/*.apk

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V29-AAB
          path: android_project/**/build/outputs/bundle/**/*.aab
