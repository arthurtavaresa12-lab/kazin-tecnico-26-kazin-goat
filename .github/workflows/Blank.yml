name: Gerar APK e AAB Android V29

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Preparar projeto
        run: |
          rm -rf android_project
          mkdir android_project
          unzip -o Kazin_Tecnico_2026_V29_APP.zip -d android_project

      - name: Localizar projeto Android
        run: |
          if [ -d "android_project/kazin_app" ]; then
            echo "PROJECT_DIR=android_project/kazin_app" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find android_project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "Projeto Android não encontrado."
              find android_project -maxdepth 4 -type f
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$PROJECT_DIR")" >> "$GITHUB_ENV"
          fi

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Preparar Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.10
          chmod +x gradlew

      - name: Gerar APK Debug
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Gerar AAB Release
        run: |
          cd "$PROJECT_DIR"
          ./gradlew bundleRelease --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V29-APK
          path: |
            android_project/kazin_app/app/build/outputs/apk/debug/*.apk

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V29-AAB
          path: |
            android_project/kazin_app/app/build/outputs/bundle/release/*.aab
