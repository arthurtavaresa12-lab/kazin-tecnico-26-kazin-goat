name: Gerar APK e AAB Android V29

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar projeto
        run: |
          mkdir -p android_project
          unzip -o Kazin_Tecnico_2026_V29_APP.zip -d android_project

      - name: Encontrar projeto Android
        run: |
          GRADLEW=$(find android_project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado"
            find android_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Dar permissão ao Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Gerar APK Debug
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Gerar AAB Release
        run: |
          cd "$PROJECT_DIR"
          ./gradlew bundleRelease --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V29-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Kazin-Tecnico-V29-AAB
          path: |
            **/app/build/outputs/bundle/release/*.aab
